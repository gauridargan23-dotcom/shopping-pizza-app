<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout - Slice & Spice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #0a0a0a;
        color: #f8fafc;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .container {
        max-width: 600px;
        margin-top: 40px;
      }

      .checkout-card {
        padding: 40px;
        background-color: #141416;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }

      .form-control,
      .form-select {
        background-color: #1c1c21 !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #fff !important;
        border-radius: 14px;
        padding: 14px 18px;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: #ff5722 !important;
        box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.2) !important;
      }

      .form-label {
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 8px;
      }

      .btn-success {
        background: linear-gradient(135deg, #10b981, #059669);
        border: none;
        border-radius: 14px;
        font-weight: 600;
        padding: 14px;
      }

      .btn-outline-primary {
        border-color: rgba(255, 255, 255, 0.2);
        color: #fff;
        border-radius: 14px;
        font-weight: 600;
      }

      .btn-outline-primary:hover {
        background-color: #fff;
        color: #000;
      }
    </style>
  </head>

  <body>
    <div class="container mb-5">
      <div class="checkout-card">

        <h2 class="text-center text-success mb-4 fw-bold">
          🍕 Slice & Spice Checkout
        </h2>

        <form id="checkoutForm">

          <!-- Full Name -->
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>

            <input
              type="text"
              class="form-control"
              id="name"
              required
            />
          </div>

          <!-- Address -->
          <div class="mb-3">
            <label for="address" class="form-label">
              Delivery Address
            </label>

            <textarea
              class="form-control"
              id="address"
              rows="3"
              required
            ></textarea>
          </div>

          <!-- Phone -->
          <div class="mb-3">
            <label for="phone" class="form-label">
              Phone Number
            </label>

            <input
              type="tel"
              class="form-control"
              id="phone"
              required
            />
          </div>

          <!-- Payment Method -->
          <div class="mb-4">
            <label for="payment" class="form-label">
              Payment Method
            </label>

            <select class="form-select" id="payment" required>

              <option
                value=""
                style="background: #1c1c21; color: #fff"
              >
                Select
              </option>

              <option
                value="cod"
                style="background: #1c1c21; color: #fff"
              >
                Cash on Delivery
              </option>

              <option
                value="card"
                style="background: #1c1c21; color: #fff"
              >
                Credit/Debit Card
              </option>

              <option
                value="upi"
                style="background: #1c1c21; color: #fff"
              >
                UPI
              </option>

            </select>
          </div>

          <!-- Place Order -->
          <button
            type="submit"
            class="btn btn-success w-100 shadow-sm"
          >
            Place Order
          </button>


          <!-- Payment Box -->
          <div
            id="paymentBox"
            class="mt-4"
            style="display: none;"
          >

            <div
              class="p-4 rounded-4"
              style="background: #1c1c21;"
            >

              <h5 class="text-warning fw-bold mb-3">
                💳 Demo Payment
              </h5>

              <p class="text-secondary mb-3">
                This is a demo payment. No real money will be charged.
              </p>


              <!-- Card Fields -->
              <div
                id="cardFields"
                style="display: none;"
              >

                <input
                  type="text"
                  id="cardNumber"
                  class="form-control mb-3"
                  placeholder="Card Number"
                />

                <div class="row">

                  <div class="col-6">

                    <input
                      type="text"
                      id="expiry"
                      class="form-control mb-3"
                      placeholder="MM/YY"
                    />

                  </div>

                  <div class="col-6">

                    <input
                      type="text"
                      id="cvv"
                      class="form-control mb-3"
                      placeholder="CVV"
                    />

                  </div>

                </div>

              </div>


              <!-- UPI Fields -->
              <div
                id="upiFields"
                style="display: none;"
              >

                <input
                  type="text"
                  id="upiId"
                  class="form-control mb-3"
                  placeholder="Enter UPI ID"
                />

              </div>


              <!-- Pay Button -->
              <button
                type="button"
                id="payButton"
                class="btn btn-success w-100"
              >
                Pay Now
              </button>

            </div>

          </div>

        </form>


        <!-- Back to Menu -->
        <div class="text-center mt-4">

          <a
            href="index.html"
            class="btn btn-outline-primary px-4 py-2"
          >
            ← Back to Menu
          </a>

        </div>

      </div>
    </div>


    <script>

      // Get elements
      const paymentSelect =
        document.getElementById("payment");

      const paymentBox =
        document.getElementById("paymentBox");

      const cardFields =
        document.getElementById("cardFields");

      const upiFields =
        document.getElementById("upiFields");

      const checkoutForm =
        document.getElementById("checkoutForm");

      const payButton =
        document.getElementById("payButton");


      // Change Payment Method
      paymentSelect.addEventListener(
        "change",
        function () {

          const method = this.value;

          // Hide payment box first
          paymentBox.style.display = "none";

          cardFields.style.display = "none";

          upiFields.style.display = "none";


          // Card
          if (method === "card") {

            paymentBox.style.display = "block";

            cardFields.style.display = "block";
          }


          // UPI
          if (method === "upi") {

            paymentBox.style.display = "block";

            upiFields.style.display = "block";
          }

        }
      );


      // Place Order
      checkoutForm.addEventListener(
        "submit",
        function (e) {

          e.preventDefault();

          const method =
            paymentSelect.value;


          // COD
          if (method === "cod") {

            alert(
              "🎉 Order placed successfully! Payment will be collected on delivery."
            );

            localStorage.removeItem("cart");

            window.location.href = "index.html";

            return;
          }


          // Card / UPI
          if (
            method === "card" ||
            method === "upi"
          ) {

            alert(
              "💳 Please complete the demo payment below."
            );

            return;
          }

        }
      );


      // Pay Now
      payButton.addEventListener(
        "click",
        function () {

          const method =
            paymentSelect.value;


          // CARD VALIDATION
          if (method === "card") {

            const cardNumber =
              document
                .getElementById("cardNumber")
                .value
                .trim();

            const expiry =
              document
                .getElementById("expiry")
                .value
                .trim();

            const cvv =
              document
                .getElementById("cvv")
                .value
                .trim();


            // Empty fields
            if (
              cardNumber === "" ||
              expiry === "" ||
              cvv === ""
            ) {

              alert(
                "⚠️ Please enter all card details."
              );

              return;
            }


            // Card number validation
            if (cardNumber.length < 12) {

              alert(
                "⚠️ Please enter a valid card number."
              );

              return;
            }


            // CVV validation
            if (cvv.length < 3) {

              alert(
                "⚠️ Please enter a valid CVV."
              );

              return;
            }

          }


          // UPI VALIDATION
          if (method === "upi") {

            const upiId =
              document
                .getElementById("upiId")
                .value
                .trim();


            if (upiId === "") {

              alert(
                "⚠️ Please enter your UPI ID."
              );

              return;
            }


            if (!upiId.includes("@")) {

              alert(
                "⚠️ Please enter a valid UPI ID."
              );

              return;
            }

          }


          // Successful Demo Payment
          alert(
            "✅ Payment successful! 🎉 Your order has been placed."
          );


          // Clear cart
          localStorage.removeItem("cart");


          // Go back to menu
          window.location.href = "index.html";

        }
      );

    </script>

  </body>
</html>
