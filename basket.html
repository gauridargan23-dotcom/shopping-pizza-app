<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basket - Slice & Spice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #0a0a0a;
        color: #f8fafc;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .navbar {
        background: rgba(10, 10, 10, 0.85) !important;
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .navbar-brand {
        font-weight: 800;
        background: linear-gradient(135deg, #ff5722, #ff9800);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .cart-box {
        background: #141416;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        padding: 2.5rem;
      }
      .list-group-item {
        background-color: #1c1c21 !important;
        border: 1px solid rgba(255, 255, 255, 0.06) !important;
        color: #fff !important;
        border-radius: 14px !important;
        margin-bottom: 10px;
        padding: 1.2rem 1.5rem;
      }
      .btn-warning {
        background: linear-gradient(135deg, #ff9800, #f57c00);
        border: none;
        font-weight: 600;
        border-radius: 12px;
      }
      .btn-success {
        background: linear-gradient(135deg, #10b981, #059669);
        border: none;
        border-radius: 14px;
        font-weight: 600;
        padding: 14px;
      }
      .btn-danger {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        border: none;
        border-radius: 14px;
        font-weight: 600;
        padding: 14px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark sticky-top py-3 mb-4">
      <div class="container">
        <a class="navbar-brand fs-4" href="index.html">🍕 Slice & Spice</a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="cart-box">
            <h2 class="text-warning text-center fw-bold mb-4">
              🛒 Your Basket
            </h2>
            <div id="cartContainer"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Exact Logic Untouched -->
    <script>
      const cartContainer = document.getElementById("cartContainer");
      const cart = JSON.parse(localStorage.getItem("cart")) || [];

      if (cart.length === 0) {
        cartContainer.innerHTML = `
        <div class="text-center py-5">
          <p class='text-muted fs-5 mb-4'>Your cart is empty 🍕</p>
          <div class="text-center mt-3">
            <a href="index.html" class="btn btn-warning px-4 py-2">Back to Menu</a>
          </div>
        </div>
      `;
      } else {
        let html = '<ul class="list-group mb-4 shadow-sm">';
        let total = 0;

       cart.forEach((item, index) => {
  const quantity = item.quantity || 1;
  const itemTotal = item.price * quantity;

  total += itemTotal;

  html += `
    <li class="list-group-item d-flex justify-content-between align-items-center">
      
      <div>
        <div class="fw-semibold">${item.name}</div>

        <div class="d-flex align-items-center gap-2 mt-2">
          <button 
            class="btn btn-sm btn-danger"
            onclick="decreaseQuantity(${index})">
            −
          </button>

          <span class="fw-bold px-2">
            ${quantity}
          </span>

          <button 
            class="btn btn-sm btn-success"
            onclick="increaseQuantity(${index})">
            +
          </button>
        </div>
      </div>

      <span class="badge bg-warning text-dark fs-6 px-3 py-2">
        ₹${itemTotal}
      </span>

    </li>
  `;
});

        html += `<li class="list-group-item d-flex justify-content-between align-items-center bg-warning text-dark fw-bold mt-3 py-3 rounded-3">
        <span class="fs-5">Total Amount</span><span class="fs-4">₹${total}</span>
      </li>`;
        html += "</ul>";

        cartContainer.innerHTML = html;
        function increaseQuantity(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart[index].quantity = (cart[index].quantity || 1) + 1;

  localStorage.setItem("cart", JSON.stringify(cart));

  location.reload();
}

function decreaseQuantity(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart[index].quantity = (cart[index].quantity || 1) - 1;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  location.reload();
}

        // Add Checkout and Clear Cart Buttons
        const btnGroup = document.createElement("div");
        btnGroup.className = "d-grid gap-3 mt-4";

        const checkoutBtn = document.createElement("a");
        checkoutBtn.href = "checkout.html";
        checkoutBtn.className = "btn btn-success shadow-sm";
        checkoutBtn.innerText = "Proceed to Checkout";

        const clearBtn = document.createElement("button");
        clearBtn.className = "btn btn-danger shadow-sm";
        clearBtn.innerText = "Clear Cart";
        clearBtn.onclick = () => {
          localStorage.removeItem("cart");
          location.reload();
        };

        btnGroup.appendChild(checkoutBtn);
        btnGroup.appendChild(clearBtn);
        cartContainer.appendChild(btnGroup);
      }
    </script>
  </body>
</html>
