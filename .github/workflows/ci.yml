
name: Slice and Spice CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t gauridargan02/slice-spice:latest .

      - name: Run Docker container
        run: docker run -d -p 8080:80 --name slice-spice-app gauridargan02/slice-spice:latest

      - name: Test application
        run: |
          for i in {1..10}; do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "Website is responding successfully!"
              exit 0
            fi
            sleep 2
          done
          echo "Website test failed!"
          docker logs slice-spice-app
          exit 1

      - name: Push Docker image to Docker Hub
        if: success() && github.event_name == 'push'
        run: docker push gauridargan02/slice-spice:latest

      - name: Stop Docker container
        if: always()
        run: docker rm -f slice-spice-app || true

