
services:
  web1:
    build: .
    container_name: slice-spice-web1
    restart: always

  web2:
    build: .
    container_name: slice-spice-web2
    restart: always

  nginx:
    image: nginx:alpine
    container_name: slice-spice-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
    restart: always
